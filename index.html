<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF2EE;--card:#fff;--ink:#17231F;--mute:#66756F;--line:#D9E1DB;--ac:#0E6F73;--acf:#fff;--star:#E8A800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1715;--card:#18231F;--ink:#EAF1ED;--mute:#93A39B;--line:#2A3A34;--ac:#4FC3C7;--acf:#08201F;--star:#F2B705}}
:root[data-theme="dark"]{--bg:#0F1715;--card:#18231F;--ink:#EAF1ED;--mute:#93A39B;--line:#2A3A34;--ac:#4FC3C7;--acf:#08201F;--star:#F2B705}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{padding:12px 16px 6px;display:grid;grid-template-columns:88px 1fr 88px;align-items:center}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;text-align:center}.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;justify-self:end}
#view{flex:1;overflow-y:auto;padding:8px 14px 24px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{display:flex;padding:5px 20px;border-radius:999px;transition:background .15s,color .15s}
nav button.on{color:var(--ink);font-weight:800}nav button.on span{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.photo{height:210px;display:grid;place-items:center;font-size:84px}
.sc{background:var(--star);color:#1b1500;font-weight:800;border-radius:10px;padding:4px 9px;font-size:16px}
.mute{color:var(--mute);font-size:13px}
h2{margin:6px 2px 12px;font-size:20px}
.btn{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.btn.fill{background:var(--ac);color:var(--acf)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:9px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acf)}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--acf);font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stats{display:flex;gap:8px;margin:12px 0}

.stats b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid div{aspect-ratio:1;display:grid;place-items:center;font-size:38px;border-radius:8px;position:relative}
.grid i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:12px;font-weight:800;background:var(--star);color:#1b1500;border-radius:6px;padding:1px 5px}
.map{width:100%;border-radius:16px;border:1px solid var(--line);background:#CFE3E0;display:block;margin-bottom:12px}
.pin{cursor:pointer}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30}
#modal.show{display:flex}
#modal .sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:90%;overflow:auto}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:40}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;margin:0 4px 4px 0}
.lnk{background:none;border:0;padding:0;display:block;width:100%;cursor:pointer;color:inherit;font:inherit;text-align:left}.photo{overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.fl:focus-within{outline:3px solid var(--ac);outline-offset:2px}.vh{position:absolute;width:1px;height:1px;opacity:0}.grid div{overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover}.btn:disabled{opacity:.35}
html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent}#view{min-height:0}.btn{min-height:38px}
.car{position:relative;background:var(--line);overflow:hidden}
.trk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trk::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center}
.sl img,.ph{width:100%;height:100%}
.sl img{object-fit:cover;display:block}
.ph{display:grid;place-items:center;font-size:84px}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px}
.cb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
.cb.l{left:8px}.cb.r{right:8px}
.grid button{aspect-ratio:1;position:relative;border:0;border-radius:8px;overflow:hidden;padding:0;font-size:38px;cursor:pointer;display:grid;place-items:center}
.grid b{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:600;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 5px}
.sgl{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:-4px 0 10px;overflow:hidden}
.sgi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.sgi:hover,.sgi:focus-visible{background:var(--bg)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.6)}
.dots i.on{background:#fff;transform:scale(1.3)}
.grid em{position:absolute;top:5px;right:6px;font-style:normal;color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pk{position:relative;border:2px solid transparent;border-radius:12px;padding:0;background:var(--card);cursor:pointer;overflow:hidden;color:var(--ink);font:inherit;text-align:left}
.pk .th{aspect-ratio:1;display:grid;place-items:center;font-size:34px;overflow:hidden}
.pk img{width:100%;height:100%;object-fit:cover}
.pk span{display:block;padding:4px 6px;font-size:12px;line-height:1.2}
.pk.sel{border-color:var(--ac)}
.pk.sel::after{content:'✓';position:absolute;top:6px;right:6px;background:var(--ac);color:var(--acf);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
@media (hover:none){.cb{display:none}}
@media (min-width:860px){#app{max-width:680px;box-shadow:0 0 0 1px var(--line)}#modal{align-items:center;justify-content:center}#modal .sheet{max-width:500px;border-radius:20px}}
#auth{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.abox{width:100%;max-width:380px;margin:auto}
.btn.gbtn{width:100%;padding:11px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;font-size:15px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.aerr{min-height:22px;margin-bottom:8px;font-size:14px}
.ig{width:100%;max-width:350px;margin:auto}
.igc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 32px;margin-bottom:10px;text-align:center}
.igc.s{padding:18px;font-size:14px}
.igt{color:var(--mute);font-weight:600;font-size:15px;margin:0 0 14px;line-height:1.3}
.igf{position:relative;display:block;margin-bottom:8px;text-align:left}
.igf input{margin:0;padding:20px 10px 6px;font-size:15px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.igf span{position:absolute;left:11px;top:14px;font-size:14px;color:var(--mute);pointer-events:none;transition:top .1s,font-size .1s}
.igf input:not(:placeholder-shown)+span,.igf input:focus+span{top:5px;font-size:10.5px}
.igf .sh{position:absolute;right:10px;top:12px;font-size:14px}
.igb{width:100%;border:0;border-radius:8px;background:var(--ac);color:var(--acf);font:inherit;font-weight:700;padding:9px;min-height:38px;cursor:pointer;margin-top:6px}
.igb:disabled{opacity:.45;cursor:default}
.lk{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;cursor:pointer;padding:0}
.lk.sm{font-weight:500;font-size:13px}
.mk{font-size:18px;background:#fff;border:2px solid #0E6F73;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hr{justify-self:end;display:flex;gap:8px}
.ib.pf{position:relative;background:var(--ac);color:var(--acf);border:0;font-weight:800;font-size:16px}
.dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#E5484D;border:2px solid var(--bg)}
.mk.bar{border-color:#C27A0E}
</style>

<script>
/* ===== CONFIGURACIÓN =====
   Déjalo así para el modo demostración, o rellénalo para el modo real (mira README.md). */

  }
};
const R=[];
const me={name:'',user:'',bio:'',pub:true,fr:0,fg:0};
let feed=[];
const FW=[],PROF={};
const COL={};
const PUB={};
const PAL=['#C0562F','#6B5BC0','#B0447A','#2E7D9A','#2E8B57','#9A6B2E','#7A8B2E','#2E6B9A'];
const ucol=u=>u=='Tú'?'#0E6F73':COL[u]||PAL[[...String(u)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const av=(u,z)=>`<div class="av" style="background:${ucol(u)}${z?`;width:${z}px;height:${z}px;font-size:${z/2}px`:''}">${esc(u[0].toUpperCase())}</div>`;
const rn=id=>R.find(r=>r.id==id);
const mk=(n,m,ids,w,msgs)=>{const sp={n,m,v:{},w,msgs};ids.forEach(id=>{const y=feed.find(p=>p.u=='Tú'&&p.r==id);sp.v[id]=y?[{u:'Tú',s:y.s,title:y.title,t:y.t,pr:y.pr,imgs:y.imgs}]:[]});return sp};
let groups=[],chats={};

const RESP=['Genial, me apunto 😋','Buena idea, lo miro y te digo','Apúntalo para la próxima','Jajaja eso quiero probarlo'];
let tab='feed',mode='list',city='',sel=null,sub=null,sub2=null,st=0,sg='g',fm='fol',wedit=false,nid=20,fc=false;
const $=s=>document.querySelector(s),v=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mt=t=>esc(t).replace(/@([\w.]*\w)/g,'<b style="color:var(--ac)">@$1</b>');

function avg(id){const a=feed.filter(p=>p.r==id).map(p=>p.s);return a.length?+(a.reduce((x,y)=>x+y)/a.length).toFixed(2):'–'}
const avgE=E=>+(E.reduce((t,e)=>t+e.s,0)/E.length).toFixed(2);
const go=x=>{sub=x;sub2=null;st=0;wedit=false;render();v.scrollTop=0};
const cur=()=>sub==null?null:(sg=='g'?groups[sub]:chats[sub]);
const sheet=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('show')},hide=()=>$('#modal').classList.remove('show');

const PE=['🍽️','🥂','🍰','☕','🧾','🌿','🍷','🥖','🍋','🥗'];
const slides=p=>{const r=rn(p.r);return p.imgs&&p.imgs.length?p.imgs.map(i=>`<img src="${i}" alt="${esc(p.title)}">`):Array.from({length:p.np||2},(_,i)=>`<div class="ph" style="background:${r.bg}">${i?PE[i%10]:r.e}</div>`)};

function carBind(){v.querySelectorAll('.car').forEach(c=>{const t=c.querySelector('.trk'),n=c.querySelector('.cnt');if(!n)return;
  t.onscroll=()=>{const k=Math.round(t.scrollLeft/t.clientWidth);n.textContent=(k+1)+'/'+t.children.length;c.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i==k))};
  c.querySelector('.l').onclick=e=>{e.stopPropagation();t.scrollBy({left:-t.clientWidth,behavior:'smooth'})};
  c.querySelector('.r').onclick=e=>{e.stopPropagation();t.scrollBy({left:t.clientWidth,behavior:'smooth'})}})}

function photoBind(imgs){
  const draw=()=>{$('#pt').textContent=imgs.length?`📷 Añadir más fotos (${imgs.length}/10)`:'📷 Elegir fotos de la galería (obligatorio, hasta 10)';
    $('#th2').innerHTML=imgs.map((u,i)=>`<div style="position:relative;flex:none"><img src="${u}" alt="Foto ${i+1}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;display:block"><button class="btn" data-rm="${i}" aria-label="Quitar foto ${i+1}" style="position:absolute;top:-6px;right:-6px;min-height:0;width:24px;height:24px;padding:0;background:var(--card);border-radius:50%">✕</button></div>`).join('');
    $('#th2').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.rm,1);draw()})};
  draw();
  $('#pf').onchange=async e=>{const fl=[...e.target.files];e.target.value='';const room=10-imgs.length;
    if(fl.length>room)toast('Máximo 10 fotos por reseña');
    const r=await Promise.all(fl.slice(0,Math.max(room,0)).map(x=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(x)})));imgs.push(...r);draw()};
}
function wishUI(list,box,title,pm,onChange){
  let ed=false;
  const row=(x,i)=>{let ic,nm,sb,rt,ex='';
    if(pm){const p=feed.find(q=>q.id==x);if(!p)return '';const r=rn(p.r);ic=`<div style="width:48px;height:48px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:24px;background:${r.bg};flex:none">${p.imgs.length?`<img src="${p.imgs[0]}" alt="" style="width:100%;height:100%;object-fit:cover">`:r.e}</div>`;nm=r.n;sb=p.title;rt=p.s}
    else{const r=rn(x);ic=`<div class="av" style="background:${r.bg};font-size:22px">${r.e}</div>`;nm=r.n;sb=r.c+' · '+r.t;rt=avg(x);const w=list===wish&&wnotes[x];if(w)ex=(w.note?`<div class="mute">📝 ${esc(w.note)}</div>`:'')+(w.tags&&w.tags.length?`<div>${w.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:'')}
    return `<div class="card pad row"><b class="mute" style="width:20px">${i+1}</b>${ic}<div style="flex:1;min-width:0"><b>${esc(nm)}</b><div class="mute">${esc(sb)}</div>${ex}</div>${ed?`<button class="btn" data-m="${i},-1" aria-label="Subir" ${i?'':'disabled'}>▲</button><button class="btn" data-m="${i},1" aria-label="Bajar" ${i<list.length-1?'':'disabled'}>▼</button><button class="btn" data-x="${i}" aria-label="Quitar">✕</button>`:`<div class="sc">${rt}</div>`}</div>`};
  const draw=()=>{
    box.innerHTML=`<div class="row sp" style="margin-bottom:10px"><b>${esc(title)} (${list.length})</b><div class="row"><button class="btn" id="we">${ed?'Listo':'Editar'}</button><button class="btn fill" id="wa">+ Añadir</button></div></div>`+(list.length?list.map(row).join(''):`<p class="mute">${pm?'Esta lista está vacía. Pulsa Añadir y elige tus publicaciones.':'Aún no hay restaurantes. Pulsa Añadir para guardar los que quieras probar.'}</p>`);
    box.querySelector('#we').onclick=()=>{ed=!ed;draw()};
    box.querySelector('#wa').onclick=()=>{
      if(pm){
        const pk=feed.filter(p=>p.u=='Tú'&&!list.includes(p.id));
        if(!pk.length)return toast(feed.some(p=>p.u=='Tú')?'Ya has añadido todas tus reseñas':'Aún no tienes reseñas. Publica una con +');
        const sel=new Set();
        sheet(`<h2>Añadir a ${esc(title)}</h2><p class="mute" style="margin-top:0">Elige entre tus publicaciones:</p><div class="pgrid">${pk.map(p=>{const r=rn(p.r);return `<button class="pk" data-k="${p.id}" aria-pressed="false"><div class="th" style="background:${r.bg}">${p.imgs.length?`<img src="${p.imgs[0]}" alt="">`:r.e}</div><span>${esc(r.n)}</span></button>`}).join('')}</div><button class="btn fill" id="wb" style="width:100%">Añadir a la lista</button>`);
        document.querySelectorAll('#sheet [data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('sel',sel.has(k));b.setAttribute('aria-pressed',sel.has(k))});
        $('#wb').onclick=()=>{if(!sel.size)return toast('Elige al menos una publicación');list.push(...sel);if(onChange)onChange();hide();draw();toast('Añadido a '+title)};
        return}
      sheet(`<h2>Añadir a ${esc(title)}</h2><div id="ph"></div>`);
      placePick($('#ph'),r=>{if(list.includes(r.id))return toast('Ya está en la lista');list.push(r.id);if(list===wish)persistWish(r.id);if(onChange)onChange();hide();draw()})};
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.m.split(',').map(Number);[list[i],list[i+d]]=[list[i+d],list[i]];if(list===wish)persistWishOrder();if(onChange)onChange();draw()});
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.x,1);if(list===wish)persistWish();if(onChange)onChange();draw()});
  };draw()}

  if(!r.full&&!r._tf){r._tf=1;fetchTags(r).then(()=>{if(tab=='explore'&&sub===r.id)render()}).catch(()=>{})}
  const t=r.tags||{},hrs=t.opening_hours,ph=tg0(t,'phone','contact:phone'),web=tg0(t,'website','contact:website','url'),mail=tg0(t,'email','contact:email');
  const h=parseHours(hrs),stt=openNow(h),posts=feed.filter(p=>p.r==r.id),imgs=posts.flatMap(p=>p.imgs||[]).slice(0,10);
  const a=avg(r.id),have=r.lat!=null&&r.lng!=null,gm=have?`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`:'';
  const svc=SV.filter(([k,val])=>t[k]==val||(val=='yes'&&t[k]=='only')).map(x=>x[2]);
  const cu=(t.cuisine||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>CU[x]||x.replace(/_/g,' ')).filter(x=>x!==r.t);
  const line=(i,x)=>`<div class="row" style="align-items:flex-start;margin-bottom:10px"><span style="width:22px">${i}</span><div style="flex:1;min-width:0">${x}</div></div>`;
  v.innerHTML=`<button class="btn" data-back>‹ Explorar</button>
  <div class="card" style="margin-top:12px"><div class="pad"><div class="row"><div class="av" style="background:${r.bg};width:58px;height:58px;font-size:30px">${r.e}</div><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(r.n)}</h2><div class="mute">${esc(r.t)}${cu.length?' · '+esc(cu.join(', ')):''}</div></div></div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap">${a!='–'?`<span class="sc">${a}</span><span class="mute">${posts.length} reseña${posts.length==1?'':'s'} en Ñam Ñam</span>`:'<span class="mute">Aún sin reseñas en Ñam Ñam</span>'}${stt?`<span class="tag" style="margin:0">${stt.open?'🟢':'🔴'} ${esc(stt.txt)}</span>`:''}</div></div>
  <div class="pad row" style="flex-wrap:wrap;gap:8px;padding-top:0"><button class="btn fill" data-val="${r.id}">Valorar</button><button class="btn" data-want="${r.id}">${wish.includes(r.id)?'Guardado ✓':'Guardar'}</button>${have?`<a class="btn" href="${gm}" target="_blank" rel="noopener noreferrer">Cómo llegar</a>`:''}${ph?`<a class="btn" href="tel:${esc(ph.replace(/[^+\d]/g,''))}">Llamar</a>`:''}${web?`<a class="btn" href="${esc(/^https?:/.test(web)?web:'https://'+web)}" target="_blank" rel="noopener noreferrer">Web</a>`:''}<button class="btn" id="shr">Compartir</button></div></div>
  ${imgs.length?`<div class="card" style="overflow:hidden">${car({id:0,r:r.id,title:r.n,imgs},220,0)}</div>`:''}
  <div class="card pad">${line('📍',esc(r.addr||r.c||'Sin dirección registrada'))}${hrs?line('🕒',hoursHTML(h,hrs)):line('🕒','<span class="mute">Sin horario registrado</span>')}${ph?line('📞',esc(ph)):''}${web?line('🌐',esc(web.replace(/^https?:\/\//,''))):''}${mail?line('✉️',esc(mail)):''}${svc.length?line('✨',svc.map(x=>`<span class="tag">${esc(x)}</span>`).join('')):''}</div>
  ${have&&OSM?`<div id="dmap" style="height:200px;border-radius:16px;margin-bottom:12px;border:1px solid var(--line);isolation:isolate"></div>`:''}
  <h2>Reseñas de la comunidad</h2>${posts.length?posts.map(p=>`<button class="card pad lnk" data-op="${p.id}" style="background:var(--card)"><div class="row">${av(p.u)}<div style="flex:1;min-width:0"><b>${esc(p.title)}</b><div class="mute">${esc(p.u)} · ${p.w}</div></div><span class="sc">${p.s}</span></div></button>`).join(''):'<p class="mute">Todavía nadie ha valorado este sitio. ¡Sé el primero!</p>'}
  <p class="mute" style="font-size:12px;margin-top:14px">Información de colaboradores de OpenStreetMap (ODbL); puede estar incompleta. ${r.osmk&&!r.osmk.startsWith('custom/')?`<a href="https://www.openstreetmap.org/${esc(r.osmk)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac)">Corrígela o complétala en OpenStreetMap</a>`:''}</p>`;
  back();bindActs(v);
  v.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{tab='feed';go(+b.dataset.op)});
  $('#shr').onclick=async()=>{const url=have?`https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`:location.href;try{if(navigator.share)await navigator.share({title:r.n,text:r.n+(r.addr?' · '+r.addr:''),url});else{await navigator.clipboard.writeText(url);toast('Enlace copiado')}}catch(e){}};
  if(have&&OSM)loadLeaflet().then(()=>{const el=$('#dmap');if(!el)return;const m=L.map(el,{scrollWheelZoom:false}).setView([r.lat,r.lng],17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);L.marker([r.lat,r.lng],{icon:L.divIcon({html:`<div class="mk ${r.k}">${r.e}</div>`,className:'',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(m)}).catch(()=>{})}
function rExploreOSM(){
  const flt=r=>(gfilter=='all'||r.k==gfilter)&&(!gname||r.n.toLowerCase().includes(gname.toLowerCase()));
  v.innerHTML=`<div class="row" style="margin-bottom:10px"><input id="q" placeholder="Ciudad o pueblo (Bilbao, Getxo…)" value="${esc(city)}" aria-label="Buscar ciudad o pueblo" style="margin:0"><button class="btn fill" id="qs">Buscar</button></div>
  <div class="row" style="margin-bottom:10px;flex-wrap:wrap"><button class="btn" id="near">Cerca de mí</button>${[['all','Todos'],['restaurant','Restaurantes'],['bar','Bares']].map(([k,t])=>`<button class="btn ${gfilter==k?'fill':''}" data-f="${k}" aria-pressed="${gfilter==k}">${t}</button>`).join('')}</div>
  <input id="gn" placeholder="Filtrar por nombre" value="${esc(gname)}" aria-label="Filtrar por nombre"><div class="seg"><button data-m="list" class="${mode=='list'?'on':''}">Lista</button><button data-m="map" class="${mode=='map'?'on':''}">Mapa</button></div><p class="mute" id="gnt" style="font-size:12px;margin:0 2px 8px"></p><div id="res"></div>
  <p class="mute" style="font-size:12px;margin-top:14px">Datos © colaboradores de OpenStreetMap (ODbL).</p>`;
  const item=r=>`<div class="card pad" data-cd="${r.id}" style="cursor:pointer"><div class="row"><div class="av" style="background:${r.bg};font-size:22px">${r.e}</div><div style="flex:1;min-width:0"><button class="lnk" data-det="${r.id}"><b>${esc(r.n)}</b></button><div class="mute">${esc(r.addr||r.c||'Sin dirección registrada')}</div><div class="mute">${esc(r.t)}</div></div>${avg(r.id)!='–'?`<div class="sc">${avg(r.id)}</div>`:''}</div><div class="row" style="margin-top:10px"><button class="btn fill" data-val="${r.id}">Valorar</button><button class="btn" data-want="${r.id}">${wish.includes(r.id)?'Guardado ✓':'Guardar'}</button></div></div>`;
  const run=async fn=>{$('#res').innerHTML='<p class="mute">Buscando bares y restaurantes…</p>';
    try{gres=await fn();gmsg=gres.length?'':'No hay bares ni restaurantes registrados en OpenStreetMap en esta zona.'}catch(e){gres=[];gmsg=e.message||'No se pudo buscar.'}draw()};
  const draw=async()=>{
    const box=$('#res'),L2=gres.filter(flt),nt=$('#gnt');
    if(nt){nt.innerHTML=gnote?esc(gnote)+(topPlace()?' · <button class="lk sm" id="fgt">Olvidar mis zonas</button>':''):'';const fg=$('#fgt');if(fg)fg.onclick=()=>{locSave({});try{localStorage.removeItem('nn_loc_ok')}catch(e){}gnote='';toast('Zonas olvidadas');draw()}}
    if(!gres.length){box.innerHTML=`<p class="mute">${esc(gmsg||'Busca una ciudad o un pueblo, o pulsa «Cerca de mí», para ver bares y restaurantes del mapa de OpenStreetMap.')}</p>`;return}
    if(!L2.length){box.innerHTML='<p class="mute">Ningún local coincide con el filtro.</p>';return}
    if(mode=='list'){box.innerHTML=`<p class="mute" style="margin:0 2px 8px">${L2.length} locales</p>`+L2.map(item).join('');bindActs(box);return}
    box.innerHTML=`<div id="gmap" style="height:360px;border-radius:16px;margin-bottom:8px;border:1px solid var(--line);isolation:isolate"></div><button class="btn" id="here" style="margin-bottom:10px">Buscar en esta zona</button><div id="pc"><p class="mute">Toca un marcador para ver el local.</p></div>`;
    const card=()=>{const r=rn(sel);if(!r)return;$('#pc').innerHTML=item(r);bindActs($('#pc'))};
    try{await loadLeaflet();
      const map=L.map($('#gmap')).setView(gview?[gview.lat,gview.lng]:[L2[0].lat,L2[0].lng],gview?gview.z:15),pts=[];
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
      L2.forEach(r=>{pts.push([r.lat,r.lng]);L.marker([r.lat,r.lng],{icon:L.divIcon({html:`<div class="mk ${r.k}">${r.e}</div>`,className:'',iconSize:[34,34],iconAnchor:[17,17]}),title:r.n}).addTo(map).on('click',()=>{sel=r.id;card()})});
      if(!gview)map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:17});
      map.on('moveend',()=>{const c=map.getCenter();gview={lat:c.lat,lng:c.lng,z:map.getZoom()}});
      $('#here').onclick=()=>{if(map.getZoom()<14)return toast('Acerca el mapa para buscar en esta zona');
        const c=map.getCenter(),rad=Math.min(3000,Math.round(map.distance(c,map.getBounds().getNorthEast())));gview={lat:c.lat,lng:c.lng,z:map.getZoom()};gnote='';run(()=>areaSearch(c.lat,c.lng,rad,city))};
    }catch(e){$('#gmap').innerHTML=`<p class="pad mute">${esc(e.message||'No se pudo cargar el mapa.')}</p>`}
  };
  $('#qs').onclick=()=>{city=$('#q').value.trim();if(!city)return;gview=null;gnote='';run(async()=>{const g=await geocode(city);return areaSearch(g.lat,g.lng,2500,g.name)})};
  $('#q').onkeydown=e=>{if(e.key=='Enter')$('#qs').click()};
  $('#near').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{gview=null;gnote='Mostrando locales cerca de tu ubicación actual';locTick(p);run(()=>areaSearch(p.coords.latitude,p.coords.longitude,1500,''))},()=>toast('No pudimos acceder a tu ubicación'),{timeout:8000}):toast('Tu navegador no permite ubicación');
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{gfilter=b.dataset.f;rExploreOSM()});
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;rExploreOSM()});
  let tm=null;$('#gn').oninput=e=>{gname=e.target.value;clearTimeout(tm);tm=setTimeout(draw,mode=='map'?400:120)};
  draw();
  if(!gres.length&&!gmsg&&!autoTried){autoTried=true;gview=null;run(async()=>{const a=await defaultArea();gnote='Mostrando locales de '+a.why+' (se calcula con tu uso de la app y se guarda solo en este dispositivo)';return areaSearch(a.lat,a.lng,1500,'')})}
}

function newReview(pre){
  let imgs=[],pr=0,rid=pre?pre.id:0;
  const ppl=()=>{const sc=x=>groups.filter(g=>g.m.includes(x)).length+(chats[x]?1:0);return [...FW].sort((a,b)=>sc(b)-sc(a))};
  const hint=x=>{const g=groups.find(g=>g.m.includes(x));return g?g.n:(chats[x]?'Chat':'')};
  sheet(`<h2>Nueva reseña</h2>
  ${photoHTML()}
  <input id="rt" placeholder="Título (ej. La mejor tortilla de Bilbao)" maxlength="60" aria-label="Título">
  <div id="ph" style="margin-bottom:10px"></div>
  <label class="mute" for="rs">Valoración: <b id="rv">8</b>/10</label><input type="range" id="rs" min="0" max="10" step="0.25" value="8">
  <div class="mute" style="margin-bottom:6px">Precio (opcional)</div>${priceHTML(0)}
  <textarea id="rd" rows="3" placeholder="Cuenta qué tal estuvo. Escribe @ para etiquetar a quien fue contigo" aria-label="Descripción"></textarea>
  <div id="sg" class="sgl" role="listbox" aria-label="Personas sugeridas" style="display:none"></div>
  <button class="btn fill" id="rp" style="width:100%;padding:12px">Publicar</button>`);
  placePick($('#ph'),r=>{rid=r.id},pre);photoBind(imgs);
  $('#rs').oninput=e=>$('#rv').textContent=e.target.value;
  priceBind(()=>pr,n=>pr=n);
  const rd=$('#rd'),sgb=$('#sg');
  const sug=()=>{const pos=rd.selectionStart,txt=rd.value.slice(0,pos),m=txt.match(/@([\w.]*)$/);
    if(!m){sgb.style.display='none';return}
    const q=m[1].toLowerCase(),L=ppl().filter(x=>x.toLowerCase().startsWith(q));
    if(!L.length){sgb.style.display='none';return}
    sgb.style.display='block';
    sgb.innerHTML=L.map(x=>`<button class="sgi" data-n="${x}" role="option">${av(x,28)}<b>${x}</b><span class="mute" style="margin-left:auto">${esc(hint(x))}</span></button>`).join('');
    sgb.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const nm='@'+b.dataset.n+' ',np=txt.length-m[0].length+nm.length;rd.value=txt.slice(0,txt.length-m[0].length)+nm+rd.value.slice(pos);rd.focus();rd.setSelectionRange(np,np);sug()})};
  rd.oninput=sug;rd.onclick=sug;rd.onkeyup=e=>{if(e.key.startsWith('Arrow'))sug()};
  $('#rp').onclick=async()=>{const id=rid,n=+$('#rs').value,title=$('#rt').value.trim(),t=rd.value.trim();
    if(!id)return toast('Elige el restaurante o bar');
    if(!imgs.length)return toast('Añade al menos una foto de tu galería');
    if(!title)return toast('Pon un título a tu reseña');

async function setFollow(p,on){
  if(REAL){
    if(on){const stt=p.pub!==false?'accepted':'pending';
      await sbx(sb.from('follows').insert({follower:ses.uid,followed:p.id,status:stt}));
      if(stt=='accepted'){if(!FW.includes(p.user)){FW.push(p.user);me.fg++}notify(p.id,'follow')}else{PEND.add(p.user);notify(p.id,'request')}
      PROF[p.user]=p;return}
    await sbx(sb.from('follows').delete().eq('follower',ses.uid).eq('followed',p.id));
    PEND.delete(p.user);const i=FW.indexOf(p.user);if(i>=0){FW.splice(i,1);me.fg--}return}
  const a=accts[ses.email];a.following=a.following||[];
  if(on){if(!a.following.includes(p.id))a.following.push(p.id)}else a.following=a.following.filter(x=>x!==p.id);store();
  if(on){if(!FW.includes(p.user)){FW.push(p.user);me.fg++}PROF[p.user]=p}else{const i=FW.indexOf(p.user);if(i>=0){FW.splice(i,1);me.fg--}}}
async function loadFollows(){
  FW.length=0;PEND.clear();INC.clear();Object.keys(PROF).forEach(k=>delete PROF[k]);
  if(REAL){
    const mineR=await sbx(sb.from('follows').select('followed,status').eq('follower',ses.uid));
    const incR=await sbx(sb.from('follows').select('follower').eq('followed',ses.uid).eq('status','pending'));
    const ids=[...new Set([...mineR.map(r=>r.followed),...incR.map(r=>r.follower)])];
    if(ids.length){const ps=await sbx(sb.from('profiles').select('id,username,name,bio,pub').in('id',ids));
      ps.forEach(r=>{PC[r.id]=r;const m=mineR.find(x=>x.followed==r.id);if(!m)return;PROF[r.username]={id:r.id,user:r.username,name:r.name,bio:r.bio||'',pub:r.pub!==false};if(m.status=='pending')PEND.add(r.username);else FW.push(r.username)})}
    incR.forEach(r=>INC.add(r.follower));
    const c=await sb.from('follows').select('follower',{count:'exact',head:true}).eq('followed',ses.uid).eq('status','accepted');me.fr=c.count||0}

    const fl=Object.entries(accts).filter(([e,x])=>(x.following||[]).includes(ses.email));me.fr=fl.length;
    notifs=fl.map(([e,x])=>{PC[e]={id:e,username:x.user,name:x.name,bio:x.bio||'',pub:x.pub!==false};return {id:'f'+e,type:'follow',from:e,fu:x.user,u:x.name,w:'',read:(a.seenF||[]).includes(e),title:'',rid:null}})}
  me.fg=FW.length}

    else ok('Es una clave anon correcta para este proyecto.')}
  else warn('La clave no empieza por sb_publishable_ ni por eyJ, así que no parece una clave de Supabase. Empieza por «'+k.slice(0,12)+'…».');
  let st=null;

    if(st.external&&st.external.google)ok('Google está activado.');else warn('Google NO está activado (Authentication → Sign In / Providers → Google).')}
  if(sb){try{const r=await sb.rpc('username_available',{u:'diagnostico_zz'});if(r.error){const em=r.error.message||'';if(r.status==401||r.error.code=='42501'||/permission denied/i.test(em))bad('La función username_available existe pero el acceso sin sesión está bloqueado (error '+(r.status||401)+'). Ejecuta en el SQL Editor: grant execute on function public.username_available(text) to anon, authenticated;');else bad('Falta el SQL parte 1 o no se ejecutó entero: '+em)}else ok('El SQL parte 1 está instalado.')}catch(e){bad('No se pudo comprobar el SQL.')}}
  ok('Dirección de esta página: '+location.origin+location.pathname+' (debe figurar en Site URL y Redirect URLs de Supabase).');
  sheet(`<h2>Comprobación de conexión</h2>${L.map(([i,t])=>`<p style="margin:0 0 10px">${i} ${esc(t)}</p>`).join('')}<button class="btn" id="dc" style="width:100%">Cerrar</button>`);$('#dc').onclick=hide}
async function linkReal(){try{await sbx(sb.auth.linkIdentity({provider:'google',options:{redirectTo:here()}}))}catch(e){toast(e.message)}}
async function saveProfile(){
  if(!ses)return;ses.name=me.name;ses.bio=me.bio;ses.pub=me.pub;
  if(REAL){try{await sbx(sb.from('profiles').update({name:me.name,bio:me.bio,pub:me.pub}).eq('id',ses.uid))}catch(e){toast('No se pudo guardar en la base de datos')}}
  else if(accts[ses.email]){Object.assign(accts[ses.email],{name:me.name,bio:me.bio,pub:me.pub});store()}}
function resetData(){PEND.clear();INC.clear();sugg=null;gres=[];gmsg='';gnote='';autoTried=false;notifs=[];ldb={};Object.keys(PC).forEach(k=>delete PC[k]);Object.keys(VC).forEach(k=>delete VC[k]);lastLoad.feed=0;lastLoad.spaces=0;clearInterval(pollT);pollT=null;FW.length=0;Object.keys(PROF).forEach(k=>delete PROF[k]);me.fr=0;me.fg=0;uq='';ures=null;umsg='';feed=[];groups=[];chats={};wish.length=0;Object.keys(cats).forEach(k=>delete cats[k]);cats['Italianos']=[];cats['Asiáticos']=[];wsync=new Set();Object.keys(wnotes).forEach(k=>delete wnotes[k])}
async function logout(){hide();resetData();if(REAL){try{await sb.auth.signOut()}catch(e){}}else{try{localStorage.removeItem('nn_sess')}catch(e){}}showAuth()}
function googleSim(link){
  sheet(`<h2>Continuar con Google</h2><p class="mute" style="margin-top:0">Simulación: con Firebase conectado se abre la ventana oficial de Google.</p><input id="ge" type="email" placeholder="tucuenta@gmail.com" autocomplete="email" aria-label="Cuenta de Google"><div id="gerr" role="alert" class="aerr"></div><button class="btn fill" id="gc" style="width:100%;padding:12px">${link?'Vincular cuenta':'Continuar'}</button>`);
  const fn=()=>{const em=$('#ge').value.trim().toLowerCase();const pc=(()=>{try{return localStorage.getItem('nn_pub_pending')||''}catch(e){return ''}})();
    if(!/^\S+@\S+\.\S+$/.test(em))return $('#gerr').textContent='⚠ Escribe un email válido';
    if(link){ses.g=true;accts[ses.email].g=true;store();hide();toast('Cuenta de Google vinculada');return}
    if(!accts[em]){const b=em.split('@')[0].replace(/[^a-z0-9._]/g,'').slice(0,20)||'usuario';let u=b,i=0;while(Object.values(accts).some(a=>a.user==u))u=b+(++i);
      accts[em]={name:b.replace(/[._]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),user:u,g:true,bio:'',pub:pc!=='false',pubSet:pc==='true'||pc==='false'}}
    accts[em].g=true;store();hide();demoEnter(em)};
  $('#gc').onclick=fn;$('#ge').onkeydown=e=>{if(e.key=='Enter')fn()};$('#ge').focus();
}
function authView(){
  const up=amode=='up';
  $('#auth').innerHTML=`<div class="ig"><div class="igc"><div style="margin-bottom:${up?12:26}px">${LOGO(52)}<div style="font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:6px">Ñam Ñam</div></div>
  ${up?`<p class="igt">Regístrate para ver los restaurantes y reseñas de tus amigos.</p><button class="btn gbtn" id="gg">${GICON} Registrarte con Google</button><div class="or"><span>O</span></div>`:''}
  <label class="igf"><input id="ae" type="email" placeholder=" " autocomplete="email" aria-label="Correo electrónico"><span>Correo electrónico</span></label>
  ${up?`<label class="igf"><input id="an" placeholder=" " autocomplete="name" aria-label="Nombre completo"><span>Nombre completo</span></label><label class="igf"><input id="au" placeholder=" " autocomplete="username" autocapitalize="none" aria-label="Nombre de usuario"><span>Nombre de usuario</span></label>`:''}
  <label class="igf"><input id="ap" type="password" placeholder=" " autocomplete="${up?'new-password':'current-password'}" aria-label="Contraseña" style="padding-right:76px"><span>Contraseña</span><button type="button" class="lk sh" id="sh" hidden>Mostrar</button></label>
  ${up?`<div style="text-align:left;margin:6px 0 4px;font-weight:700;font-size:14px">Tipo de cuenta</div><div class="seg" style="margin-bottom:6px"><button type="button" data-ap="1" class="${apub===true?'on':''}">🌍 Pública</button><button type="button" data-ap="0" class="${apub===false?'on':''}">🔒 Privada</button></div><p class="mute" id="aph" style="font-size:12px;margin:0 0 8px;text-align:left">${apub===null?'Elige una opción para continuar.':apub?'Tus reseñas las puede ver cualquiera en Descubrir y cualquiera puede seguirte.':'Solo te verán quienes aceptes. Quien quiera seguirte tendrá que pedírtelo.'}</p>`:''}
  ${up?'<p class="mute" style="font-size:12px;margin:6px 0">Al registrarte aceptas las condiciones y la política de privacidad de Ñam Ñam.</p>':''}
  <button class="igb" id="as" disabled>${up?'Registrarte':'Iniciar sesión'}</button>
  <div id="aerr" role="alert" class="aerr" style="margin-top:10px"></div>
  ${up?'':`<div class="or"><span>O</span></div><button class="btn gbtn" id="gg">${GICON} Iniciar sesión con Google</button><div style="margin-top:14px"><button class="lk sm" id="fp">¿Has olvidado tu contraseña?</button></div>`}
  </div><div class="igc s">${up?'¿Tienes una cuenta?':'¿No tienes una cuenta?'} <button class="lk" data-am="${up?'in':'up'}">${up?'Inicia sesión':'Regístrate'}</button></div>
  ${REAL?'<p style="text-align:center;margin:6px 0"><button class="lk sm" id="dg0">¿Problemas para entrar? Comprobar conexión</button></p>':'<p class="mute" style="text-align:center;font-size:12px">Modo demostración: las cuentas se guardan solo en este navegador. Conecta Supabase para guardarlas en una base de datos real.</p>'}</div>`;
  const val=()=>({email:$('#ae').value.trim().toLowerCase(),pw:$('#ap').value,name:up?$('#an').value.trim():'',user:up?$('#au').value.trim():'',pub:apub});
  const ok=()=>{const d=val();return /^\S+@\S+\.\S+$/.test(d.email)&&d.pw.length>=6&&(!up||(d.name&&/^[a-z0-9._]{3,20}$/.test(d.user)&&apub!==null))};
  const chk=()=>{$('#as').disabled=!ok()};
  const err=m=>$('#aerr').textContent=m?'⚠ '+m:'';
  const submit=async()=>{if(!ok())return;err('');$('#as').disabled=true;const d=val();
    try{if(up)await authRegister(d);else await authLogin(d.email,d.pw)}catch(e){err(e.message)}chk()};
  document.querySelectorAll('#auth input').forEach(i=>{
    i.oninput=()=>{if(i.id=='au')i.value=i.value.toLowerCase().replace(/[^a-z0-9._]/g,'');if(i.id=='ap')$('#sh').hidden=!i.value;chk()};
    i.onkeydown=e=>{if(e.key=='Enter')submit()}});
  $('#sh').onclick=()=>{const p=$('#ap'),h=p.type=='password';p.type=h?'text':'password';$('#sh').textContent=h?'Ocultar':'Mostrar'};
  $('#as').onclick=submit;
  document.querySelectorAll('#auth [data-ap]').forEach(b=>b.onclick=()=>{apub=b.dataset.ap=='1';document.querySelectorAll('#auth [data-ap]').forEach(x=>x.classList.toggle('on',(x.dataset.ap=='1')==apub));const h=$('#aph');if(h)h.textContent=apub?'Tus reseñas las puede ver cualquiera en Descubrir y cualquiera puede seguirte.':'Solo te verán quienes aceptes. Quien quiera seguirte tendrá que pedírtelo.';chk()});
  $('#gg').onclick=()=>{if(up&&apub===null)return err('Elige primero si tu cuenta será pública o privada.');try{localStorage.setItem('nn_pub_pending',up?String(apub):'')}catch(e){}REAL?authGoogleReal(err):googleSim(false)};
  if(!up)$('#fp').onclick=async()=>{const m=$('#ae').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m))return err('Escribe tu correo arriba y vuelve a pulsar.');
    try{await authReset(m);err('');$('#aerr').textContent='✉ Si existe una cuenta con ese correo, te hemos enviado un enlace para restablecerla.'}catch(e){err(e.message)}};
  document.querySelectorAll('#auth [data-am]').forEach(b=>b.onclick=()=>{amode=b.dataset.am;authView()});
  if($('#dg0'))$('#dg0').onclick=diagnose;
}
async function boot(){
  showAuth();
  if(REAL){
    const ue=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,'')).get('error_description');
    if(ue){history.replaceState(null,'',location.pathname);$('#aerr').textContent='⚠ '+SERR({message:ue})}
    try{await sbInit()}catch(e){$('#aerr').textContent='⚠ No se pudo conectar con Supabase. Revisa la configuración.';return}
    sb.auth.onAuthStateChange((ev,session)=>{
      if(ev=='PASSWORD_RECOVERY')setTimeout(()=>{sheet(`<h2>Nueva contraseña</h2><input id="np" type="password" placeholder="Nueva contraseña (mínimo 6)" autocomplete="new-password" aria-label="Nueva contraseña"><div id="nperr" class="aerr"></div><button class="btn fill" id="npb" style="width:100%;padding:12px">Guardar contraseña</button>`);
        $('#npb').onclick=async()=>{const p=$('#np').value;if(p.length<6)return $('#nperr').textContent='⚠ Mínimo 6 caracteres';try{await sbx(sb.auth.updateUser({password:p}));hide();toast('Contraseña actualizada')}catch(e){$('#nperr').textContent='⚠ '+e.message}}},300);
      if(session){if(ses&&ses.uid==session.user.id)return;
        setTimeout(()=>afterSession(session.user).catch(e=>{showAuth();$('#aerr').textContent='⚠ No se pudo cargar tu perfil: '+((e&&e.message)||'revisa la configuración de la base de datos')}),0)}
      else if(ev=='SIGNED_OUT')showAuth()});
    return}
  let e=null;try{e=localStorage.getItem('nn_sess')}catch(x){}
  if(e&&accts[e])demoEnter(e)}
$('#hp').onclick=()=>{if(ses){tab='me';go(null)}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')locSample()});
render();boot();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
