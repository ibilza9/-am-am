<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ñam Ñam · Tu diario de restaurantes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF2EE;--card:#fff;--ink:#17231F;--mute:#66756F;--line:#D9E1DB;--ac:#0E6F73;--acf:#fff;--star:#E8A800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1715;--card:#18231F;--ink:#EAF1ED;--mute:#93A39B;--line:#2A3A34;--ac:#4FC3C7;--acf:#08201F;--star:#F2B705}}
:root[data-theme="dark"]{--bg:#0F1715;--card:#18231F;--ink:#EAF1ED;--mute:#93A39B;--line:#2A3A34;--ac:#4FC3C7;--acf:#08201F;--star:#F2B705}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{padding:12px 16px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;text-align:center}.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;justify-self:end}
#view{flex:1;overflow-y:auto;padding:8px 14px 24px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{display:flex;padding:5px 20px;border-radius:999px;transition:background .15s,color .15s}
nav button.on{color:var(--ink);font-weight:800}nav button.on span{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.photo{height:210px;display:grid;place-items:center;font-size:84px}
.sc{background:var(--star);color:#1b1500;font-weight:800;border-radius:10px;padding:4px 9px;font-size:16px}
.mute{color:var(--mute);font-size:13px}
h2{margin:6px 2px 12px;font-size:20px}
.btn{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.btn.fill{background:var(--ac);color:var(--acf)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:9px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acf)}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--acf);font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stats{display:flex;gap:8px;margin:12px 0}
.stats div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid div{aspect-ratio:1;display:grid;place-items:center;font-size:38px;border-radius:8px;position:relative}
.grid i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:12px;font-weight:800;background:var(--star);color:#1b1500;border-radius:6px;padding:1px 5px}
.map{width:100%;border-radius:16px;border:1px solid var(--line);background:#CFE3E0;display:block;margin-bottom:12px}
.pin{cursor:pointer}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30}
#modal.show{display:flex}
#modal .sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:90%;overflow:auto}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:40}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;margin:0 4px 4px 0}
.lnk{background:none;border:0;padding:0;display:block;width:100%;cursor:pointer;color:inherit;font:inherit;text-align:left}.photo{overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.fl:focus-within{outline:3px solid var(--ac);outline-offset:2px}.vh{position:absolute;width:1px;height:1px;opacity:0}.grid div{overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover}.btn:disabled{opacity:.35}
html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent}#view{min-height:0}.btn{min-height:38px}
.car{position:relative;background:var(--line);overflow:hidden}
.trk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trk::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center}
.sl img,.ph{width:100%;height:100%}
.sl img{object-fit:cover;display:block}
.ph{display:grid;place-items:center;font-size:84px}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px}
.cb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
.cb.l{left:8px}.cb.r{right:8px}
.grid button{aspect-ratio:1;position:relative;border:0;border-radius:8px;overflow:hidden;padding:0;font-size:38px;cursor:pointer;display:grid;place-items:center}
.grid b{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:600;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 5px}
.sgl{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:-4px 0 10px;overflow:hidden}
.sgi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.sgi:hover,.sgi:focus-visible{background:var(--bg)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.6)}
.dots i.on{background:#fff;transform:scale(1.3)}
.grid em{position:absolute;top:5px;right:6px;font-style:normal;color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pk{position:relative;border:2px solid transparent;border-radius:12px;padding:0;background:var(--card);cursor:pointer;overflow:hidden;color:var(--ink);font:inherit;text-align:left}
.pk .th{aspect-ratio:1;display:grid;place-items:center;font-size:34px;overflow:hidden}
.pk img{width:100%;height:100%;object-fit:cover}
.pk span{display:block;padding:4px 6px;font-size:12px;line-height:1.2}
.pk.sel{border-color:var(--ac)}
.pk.sel::after{content:'✓';position:absolute;top:6px;right:6px;background:var(--ac);color:var(--acf);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
@media (hover:none){.cb{display:none}}
@media (min-width:860px){#app{max-width:680px;box-shadow:0 0 0 1px var(--line)}#modal{align-items:center;justify-content:center}#modal .sheet{max-width:500px;border-radius:20px}}
#auth{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.abox{width:100%;max-width:380px;margin:auto}
.btn.gbtn{width:100%;padding:11px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;font-size:15px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.aerr{min-height:22px;margin-bottom:8px;font-size:14px}
.ig{width:100%;max-width:350px;margin:auto}
.igc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 32px;margin-bottom:10px;text-align:center}
.igc.s{padding:18px;font-size:14px}
.igt{color:var(--mute);font-weight:600;font-size:15px;margin:0 0 14px;line-height:1.3}
.igf{position:relative;display:block;margin-bottom:8px;text-align:left}
.igf input{margin:0;padding:20px 10px 6px;font-size:15px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.igf span{position:absolute;left:11px;top:14px;font-size:14px;color:var(--mute);pointer-events:none;transition:top .1s,font-size .1s}
.igf input:not(:placeholder-shown)+span,.igf input:focus+span{top:5px;font-size:10.5px}
.igf .sh{position:absolute;right:10px;top:12px;font-size:14px}
.igb{width:100%;border:0;border-radius:8px;background:var(--ac);color:var(--acf);font:inherit;font-weight:700;padding:9px;min-height:38px;cursor:pointer;margin-top:6px}
.igb:disabled{opacity:.45;cursor:default}
.lk{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;cursor:pointer;padding:0}
.lk.sm{font-weight:500;font-size:13px}
.mk{font-size:18px;background:#fff;border:2px solid #0E6F73;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="app">
  <header><svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Logo de Ñam Ñam"><rect width="40" height="40" rx="12" fill="var(--ac)"/><path d="M8 20h24a12 12 0 0 1-24 0z" fill="var(--acf)"/><path d="M15 15q-2-3 0-5M21 15q-2-3 0-5M27 15q-2-3 0-5" stroke="var(--acf)" stroke-width="2" fill="none" stroke-linecap="round"/></svg><h1>Ñam Ñam</h1><button class="ib" id="th" aria-label="Cambiar tema">◐</button></header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Nueva valoración">+</button>
  <nav>
    <button data-t="feed"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/></svg></span>Inicio</button>
    <button data-t="social"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.9 4.5 4.5"/></svg></span>Social</button>
    <button data-t="explore"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Explorar</button>
    <button data-t="me"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>Perfil</button>
  </nav>
  <div id="modal"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
  <div id="auth" role="dialog" aria-modal="true" aria-label="Iniciar sesión o crear cuenta"></div>
</div>
<script>
/* ===== CONFIGURACIÓN =====
   Déjalo así para el modo demostración, o rellénalo para el modo real (mira README.md). */
const CONFIG={
  OSM:true,      // true = mapa de OpenStreetMap (Leaflet) + bares y restaurantes reales (Overpass)
  SUPABASE:{url:'https://lpegejsiwisuqbrkhprb.supabase.co', key:'sb_publishable_d5VOX5EgxLSqQkHTJImicg_puZOuJft!'} //= cuentas y base de datos
};
const R=[];
const me={name:'',user:'',bio:'',pub:true,fr:0,fg:0};
let feed=[];
const FW=[],PROF={};
const COL={};
const PUB={};
const PAL=['#C0562F','#6B5BC0','#B0447A','#2E7D9A','#2E8B57','#9A6B2E','#7A8B2E','#2E6B9A'];
const ucol=u=>u=='Tú'?'#0E6F73':COL[u]||PAL[[...String(u)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const av=(u,z)=>`<div class="av" style="background:${ucol(u)}${z?`;width:${z}px;height:${z}px;font-size:${z/2}px`:''}">${esc(u[0].toUpperCase())}</div>`;
const rn=id=>R.find(r=>r.id==id);
const mk=(n,m,ids,w,msgs)=>{const sp={n,m,v:{},w,msgs};ids.forEach(id=>{const y=feed.find(p=>p.u=='Tú'&&p.r==id);sp.v[id]=y?[{u:'Tú',s:y.s,title:y.title,t:y.t,pr:y.pr,imgs:y.imgs}]:[]});return sp};
let groups=[],chats={};
let wish=[],cats={'Italianos':[],'Asiáticos':[]};
const RESP=['Genial, me apunto 😋','Buena idea, lo miro y te digo','Apúntalo para la próxima','Jajaja eso quiero probarlo'];
let tab='feed',mode='list',city='',sel=null,sub=null,sub2=null,st=0,sg='g',fm='fol',wedit=false,nid=20,fc=false;
const $=s=>document.querySelector(s),v=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mt=t=>esc(t).replace(/@([\w.]*\w)/g,'<b style="color:var(--ac)">@$1</b>');
const eur=n=>'€'.repeat(n),PL=['','Económico','Normal','Caro','Muy caro'];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function avg(id){const a=feed.filter(p=>p.r==id).map(p=>p.s);return a.length?+(a.reduce((x,y)=>x+y)/a.length).toFixed(2):'–'}
const avgE=E=>+(E.reduce((t,e)=>t+e.s,0)/E.length).toFixed(2);
const go=x=>{sub=x;sub2=null;st=0;wedit=false;render();v.scrollTop=0};
const cur=()=>sub==null?null:(sg=='g'?groups[sub]:chats[sub]);
const sheet=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('show')},hide=()=>$('#modal').classList.remove('show');
const back=()=>v.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(null));
const seg2=a=>`<div class="seg">${a.map((t,i)=>`<button data-st="${i}" class="${i==st?'on':''}">${t}</button>`).join('')}</div>`;
const segBind=()=>v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=+b.dataset.st;wedit=false;render()});
const opts=ids=>R.filter(r=>!ids.includes(r.id)).map(r=>`<option value="${r.id}">${esc(r.n)} · ${esc(r.c)}</option>`).join('');
const priceHTML=pr=>`<div class="row" style="margin-bottom:10px">${[1,2,3,4].map(n=>`<button class="btn ${pr==n?'fill':''}" data-pr="${n}" style="flex:1;padding:8px 2px" aria-pressed="${pr==n}">${eur(n)}</button>`).join('')}</div>`;
const priceBind=(get,set)=>document.querySelectorAll('#sheet [data-pr]').forEach(b=>b.onclick=()=>{const n=+b.dataset.pr;set(get()==n?0:n);document.querySelectorAll('#sheet [data-pr]').forEach(x=>{const on=+x.dataset.pr==get();x.classList.toggle('fill',on);x.setAttribute('aria-pressed',on)})});
const PE=['🍽️','🥂','🍰','☕','🧾','🌿','🍷','🥖','🍋','🥗'];
const slides=p=>{const r=rn(p.r);return p.imgs&&p.imgs.length?p.imgs.map(i=>`<img src="${i}" alt="${esc(p.title)}">`):Array.from({length:p.np||2},(_,i)=>`<div class="ph" style="background:${r.bg}">${i?PE[i%10]:r.e}</div>`)};
const car=(p,h,open)=>{const sl=slides(p);return `<div class="car" style="height:${h}px"${open?` data-open="${p.id}"`:''}><div class="trk">${sl.map(x=>`<div class="sl">${x}</div>`).join('')}</div>${sl.length>1?`<div class="dots">${sl.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><span class="cnt">1/${sl.length}</span><button class="cb l" aria-label="Foto anterior">‹</button><button class="cb r" aria-label="Foto siguiente">›</button>`:''}</div>`};
function carBind(){v.querySelectorAll('.car').forEach(c=>{const t=c.querySelector('.trk'),n=c.querySelector('.cnt');if(!n)return;
  t.onscroll=()=>{const k=Math.round(t.scrollLeft/t.clientWidth);n.textContent=(k+1)+'/'+t.children.length;c.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i==k))};
  c.querySelector('.l').onclick=e=>{e.stopPropagation();t.scrollBy({left:-t.clientWidth,behavior:'smooth'})};
  c.querySelector('.r').onclick=e=>{e.stopPropagation();t.scrollBy({left:t.clientWidth,behavior:'smooth'})}})}

const photoHTML=()=>`<label class="btn fill fl" style="display:block;text-align:center;margin-bottom:8px;cursor:pointer;border-radius:14px;padding:12px"><span id="pt"></span><input type="file" id="pf" class="vh" accept="image/*" multiple></label><div id="th2" style="display:flex;gap:10px;overflow-x:auto;padding:6px 6px 8px 0"></div>`;
function photoBind(imgs){
  const draw=()=>{$('#pt').textContent=imgs.length?`📷 Añadir más fotos (${imgs.length}/10)`:'📷 Elegir fotos de la galería (obligatorio, hasta 10)';
    $('#th2').innerHTML=imgs.map((u,i)=>`<div style="position:relative;flex:none"><img src="${u}" alt="Foto ${i+1}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;display:block"><button class="btn" data-rm="${i}" aria-label="Quitar foto ${i+1}" style="position:absolute;top:-6px;right:-6px;min-height:0;width:24px;height:24px;padding:0;background:var(--card);border-radius:50%">✕</button></div>`).join('');
    $('#th2').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.rm,1);draw()})};
  draw();
  $('#pf').onchange=async e=>{const fl=[...e.target.files];e.target.value='';const room=10-imgs.length;
    if(fl.length>room)toast('Máximo 10 fotos por reseña');
    const r=await Promise.all(fl.slice(0,Math.max(room,0)).map(x=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(x)})));imgs.push(...r);draw()};
}
function wishUI(list,box,title,pm,onChange){
  let ed=false;
  const row=(x,i)=>{let ic,nm,sb,rt,ex='';
    if(pm){const p=feed.find(q=>q.id==x);if(!p)return '';const r=rn(p.r);ic=`<div style="width:48px;height:48px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:24px;background:${r.bg};flex:none">${p.imgs.length?`<img src="${p.imgs[0]}" alt="" style="width:100%;height:100%;object-fit:cover">`:r.e}</div>`;nm=r.n;sb=p.title;rt=p.s}
    else{const r=rn(x);ic=`<div class="av" style="background:${r.bg};font-size:22px">${r.e}</div>`;nm=r.n;sb=r.c+' · '+r.t;rt=avg(x);const w=list===wish&&wnotes[x];if(w)ex=(w.note?`<div class="mute">📝 ${esc(w.note)}</div>`:'')+(w.tags&&w.tags.length?`<div>${w.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:'')}
    return `<div class="card pad row"><b class="mute" style="width:20px">${i+1}</b>${ic}<div style="flex:1;min-width:0"><b>${esc(nm)}</b><div class="mute">${esc(sb)}</div>${ex}</div>${ed?`<button class="btn" data-m="${i},-1" aria-label="Subir" ${i?'':'disabled'}>▲</button><button class="btn" data-m="${i},1" aria-label="Bajar" ${i<list.length-1?'':'disabled'}>▼</button><button class="btn" data-x="${i}" aria-label="Quitar">✕</button>`:`<div class="sc">${rt}</div>`}</div>`};
  const draw=()=>{

  await sbx(sb.from('space_messages').insert({space_id:sp.dbid,user_id:ses.uid,review_id:p.dbid,is_new:!!nw}))}catch(e){toast('No se pudo compartir en la base de datos')}})}
function persistSpaceWish(sp){if(!REAL)return;chain(sp,async()=>{try{await sp.ready;await sbx(sb.from('space_wish').delete().eq('space_id',sp.dbid));
  const rows=[];for(let i=0;i<sp.w.length;i++){const r=rn(sp.w[i]);if(!r)continue;await ensureVenue(r);if(r.dbid)rows.push({space_id:sp.dbid,venue_id:r.dbid,added_by:ses.uid,position:i})}
  if(rows.length)await sbx(sb.from('space_wish').insert(rows))}catch(e){toast('No se pudo sincronizar la lista')}})}
function persistWishOrder(){if(!REAL||!ses)return;chain('wo',async()=>{try{const rows=[];for(let i=0;i<wish.length;i++){const r=rn(wish[i]);if(r&&r.dbid){const n=wnotes[wish[i]]||{note:'',tags:[]};rows.push({user_id:ses.uid,venue_id:r.dbid,position:i,note:n.note,tags:n.tags})}}if(rows.length)await sbx(sb.from('saved_venues').upsert(rows,{onConflict:'user_id,venue_id'}))}catch(e){toast('No se pudo guardar el orden')}})}
function persistList(name){if(!REAL||!ses)return;chain('l:'+name,async()=>{try{
  if(!ldb[name]){const d=await sbx(sb.from('lists').upsert({user_id:ses.uid,name},{onConflict:'user_id,name'}).select('id').single());ldb[name]=d.id}
  await sbx(sb.from('list_items').delete().eq('list_id',ldb[name]));
  const rows=(cats[name]||[]).filter(id=>feed.some(p=>p.id==id)).map((id,i)=>({list_id:ldb[name],review_id:id,position:i}));
  if(rows.length)await sbx(sb.from('list_items').insert(rows))}catch(e){toast('No se pudo guardar la lista')}})}
async function loadLists(){
  const ls=await sbx(sb.from('lists').select('*').eq('user_id',ses.uid));ldb={};
  const its=ls.length?await sbx(sb.from('list_items').select('*').in('list_id',ls.map(l=>l.id)).order('position')):[];
  ls.forEach(l=>{ldb[l.name]=l.id;cats[l.name]=its.filter(x=>x.list_id==l.id).map(x=>x.review_id)})}
async function loadNotifs(){
  const rows=await sbx(sb.from('notifications').select('*').eq('user_id',ses.uid).order('id',{ascending:false}).limit(40));
  await profilesById(rows.map(r=>r.from_user));const rids=rows.map(r=>r.review_id).filter(Boolean);
  const rv=rids.length?await sbx(sb.from('reviews').select('id,title').in('id',rids)):[];
  notifs=rows.map(r=>({id:r.id,type:r.type,rid:r.review_id,read:r.read,w:ago(r.created_at),u:PC[r.from_user]?(PC[r.from_user].name||PC[r.from_user].username):'Alguien',title:(rv.find(x=>x.id==r.review_id)||{}).title||''}))}
function notify(uid,type,rid){if(!REAL||!ses||!uid||uid==ses.uid)return;sb.from('notifications').insert({user_id:uid,from_user:ses.uid,type,review_id:rid||null}).then(()=>{})}
function notifScreen(){
  v.innerHTML=`<button class="btn" data-back>‹ Perfil</button><h2 style="margin-top:12px">Notificaciones</h2>`+(notifs.length?notifs.map(n=>`<button class="card pad lnk" data-n="${n.id}" style="background:var(--card)"><b>${esc(n.u)}</b> ${n.type=='tag'?'te etiquetó en':n.type=='comment'?'comentó en':'ha empezado a seguirte'}${n.type!='follow'?` «${esc(n.title)}»`:''}<div class="mute">${n.w}${n.read?'':' · nueva'}</div></button>`).join(''):'<p class="mute">No tienes notificaciones.</p>');
  back();
  v.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=notifs.find(x=>x.id==b.dataset.n);if(n.rid&&feed.some(p=>p.id==n.rid))go(n.rid);else toast('Esa reseña ya no está disponible')});
  if(REAL&&notifs.some(n=>!n.read)){notifs.forEach(n=>n.read=true);sb.from('notifications').update({read:true}).eq('user_id',ses.uid).eq('read',false).then(()=>{})}}
function softRefresh(k){
  if(!REAL||!ses||Date.now()-lastLoad[k]<15000)return;lastLoad[k]=Date.now();
  (k=='feed'?loadFeed():loadSpaces()).then(()=>{if((k=='feed'&&tab=='feed'&&sub==null)||(k=='spaces'&&tab=='social'&&sub==null))render()}).catch(()=>{})}
async function pollSpace(sp){
  if(!REAL||!sp.dbid||tab!='social'||cur()!==sp||st!=0||sub2!=null)return;
  try{const rows=await sbx(sb.from('space_messages').select('*').eq('space_id',sp.dbid).gt('id',sp.lastId||0).order('id'));
    if(!rows.length)return;sp.lastId=Math.max(...rows.map(r=>r.id));
    const others=rows.filter(r=>r.user_id!==ses.uid);if(!others.length)return;
    if(others.some(r=>r.review_id)){const id=sp.dbid,dm=sp.kind=='dm',nm=sp.n;await loadSpaces();const ns=dm?chats[nm]:groups.find(g=>g.dbid==id);if(ns)sub=dm?nm:groups.indexOf(ns)}
    else{await profilesById(others.map(r=>r.user_id));others.forEach(r=>sp.msgs.push({id:r.id,u:uname(r.user_id),t:r.body}))}
    const x=$('#mi')?$('#mi').value:'';render();if($('#mi'))$('#mi').value=x}catch(e){}}
let uq='',ures=null,umsg='';
async function findUsers(q){
  const t=q.replace(/[%,()*\\]/g,' ').trim().toLowerCase();
  if(REAL){const rows=await sbx(sb.from('profiles').select('id,username,name,bio,pub').or(`username.ilike.*${t}*,name.ilike.*${t}*`).neq('id',ses.uid).limit(20));
    return rows.map(r=>({id:r.id,user:r.username,name:r.name,bio:r.bio||'',pub:r.pub!==false}))}
  return Object.entries(accts).filter(([e,a])=>e!==ses.email&&((a.name||'').toLowerCase().includes(t)||(a.user||'').toLowerCase().includes(t))).slice(0,20).map(([e,a])=>({id:e,user:a.user,name:a.name,bio:a.bio||'',pub:a.pub!==false}))}
async function setFollow(p,on){
  if(REAL){if(on){await sbx(sb.from('follows').insert({follower:ses.uid,followed:p.id}));notify(p.id,'follow')}else await sbx(sb.from('follows').delete().eq('follower',ses.uid).eq('followed',p.id))}
  else{const a=accts[ses.email];a.following=a.following||[];if(on){if(!a.following.includes(p.id))a.following.push(p.id)}else a.following=a.following.filter(x=>x!==p.id);store()}
  if(on){if(!FW.includes(p.user)){FW.push(p.user);me.fg++}PROF[p.user]=p}else{const i=FW.indexOf(p.user);if(i>=0){FW.splice(i,1);me.fg--}}}
async function loadFollows(){
  FW.length=0;Object.keys(PROF).forEach(k=>delete PROF[k]);
  if(REAL){
    const rows=await sbx(sb.from('follows').select('followed').eq('follower',ses.uid));
    if(rows.length){const ps=await sbx(sb.from('profiles').select('id,username,name,bio,pub').in('id',rows.map(r=>r.followed)));
      ps.forEach(r=>{FW.push(r.username);PROF[r.username]={id:r.id,user:r.username,name:r.name,bio:r.bio||'',pub:r.pub!==false}})}
    const c=await sb.from('follows').select('follower',{count:'exact',head:true}).eq('followed',ses.uid);me.fr=c.count||0}
  else{const a=accts[ses.email]||{};
    (a.following||[]).forEach(e=>{const b=accts[e];if(b){FW.push(b.user);PROF[b.user]={id:e,user:b.user,name:b.name,bio:b.bio||'',pub:b.pub!==false}}});
    me.fr=Object.values(accts).filter(x=>(x.following||[]).includes(ses.email)).length}
  me.fg=FW.length}
function sheetUser(u){
  const f=FW.includes(u.user);
  sheet(`<div class="row" style="margin-bottom:10px">${av(u.user,56)}<div><h2 style="margin:0">${esc(u.name)}</h2><div class="mute">@${esc(u.user)} · ${u.pub?'Perfil público':'Perfil privado'}</div></div></div><p>${u.bio?esc(u.bio):'<span class="mute">Sin bio.</span>'}</p><button class="btn ${f?'':'fill'}" id="uf" style="width:100%;padding:12px">${f?'Siguiendo':'Seguir'}</button>`);
  $('#uf').onclick=async()=>{const on=!FW.includes(u.user);try{await setFollow(u,on);hide();toast(on?'Ahora sigues a '+u.name:'Has dejado de seguir a '+u.name);if(tab=='feed'&&sub==null&&fm=='all')usersUI()}catch(e){toast(e.message)}}}
function usersUI(){
  const inp=$('#us'),box=$('#ur'),dg=$('#dg');
  const card=u=>{const f=FW.includes(u.user);return `<div class="card pad row">${av(u.user)}<button class="lnk" data-pu="${esc(u.user)}" style="flex:1;min-width:0"><b>${esc(u.name)}</b><div class="mute">@${esc(u.user)}${u.pub?'':' · perfil privado'}</div></button><button class="btn ${f?'':'fill'}" data-fo="${esc(u.user)}">${f?'Siguiendo':'Seguir'}</button></div>`};
  const draw=()=>{
    if(ures===null&&!umsg){box.innerHTML='';dg.style.display='';return}
    dg.style.display='none';
    box.innerHTML=umsg?`<p class="mute">${esc(umsg)}</p>`:(ures.length?ures.map(card).join(''):'<p class="mute">No hemos encontrado a nadie con ese nombre.</p>');
    box.querySelectorAll('[data-fo]').forEach(b=>b.onclick=async()=>{const u=ures.find(x=>x.user==b.dataset.fo),on=!FW.includes(u.user);b.disabled=true;
      try{await setFollow(u,on);toast(on?'Ahora sigues a '+u.name:'Has dejado de seguir a '+u.name)}catch(e){toast(e.message)}draw()});
    box.querySelectorAll('[data-pu]').forEach(b=>b.onclick=()=>sheetUser(ures.find(x=>x.user==b.dataset.pu)))};
  const run=async()=>{uq=inp.value.trim();
    if(!uq){ures=null;umsg='';draw();return}
    if(uq.length<2){ures=null;umsg='Escribe al menos 2 letras.';draw();return}
    umsg='';dg.style.display='none';box.innerHTML='<p class="mute">Buscando…</p>';
    try{ures=await findUsers(uq)}catch(e){ures=null;umsg=e.message||'No se pudo buscar.'}draw()};
  let t=null;inp.oninput=()=>{clearTimeout(t);t=setTimeout(run,350)};
  inp.onkeydown=e=>{if(e.key=='Enter'){clearTimeout(t);run()}};$('#ub').onclick=run;
  draw()}
function enterApp(){
  me.name=ses.name;me.user='@'+ses.user;me.bio=ses.bio||'';me.pub=ses.pub!==false;me.fr=0;me.fg=0;
  $('#auth').style.display='none';lock(false);tab='feed';go(null)}
function demoEnter(email){ses={...accts[email],email};try{localStorage.setItem('nn_sess',email)}catch(e){}enterApp();loadFollows().then(render)}
function showAuth(){ses=null;amode='in';authView();$('#auth').style.display='flex';lock(true)}
async function authRegister(d){
  if(REAL){
    if(!(await sbx(sb.rpc('username_available',{u:d.user}))))throw E('Ese nombre de usuario no está disponible.');
    const r=await sbx(sb.auth.signUp({email:d.email,password:d.pw,options:{data:{name:d.name,username:d.user},emailRedirectTo:here()}}));
    if(r.user&&r.user.identities&&!r.user.identities.length)throw E('Ya existe una cuenta con ese correo.');
    if(!r.session){amode='in';authView();$('#aerr').textContent='✉ Te hemos enviado un correo para confirmar tu cuenta. Después podrás iniciar sesión.'}
    return}
  if(accts[d.email])throw E('Ya existe una cuenta con ese correo.');
  if(Object.values(accts).some(a=>a.user==d.user))throw E('Ese nombre de usuario no está disponible.');
  accts[d.email]={name:d.name,user:d.user,h:await sha(d.pw),g:false,bio:'',pub:true};store();demoEnter(d.email)}
async function authLogin(email,pw){
  if(REAL){await sbx(sb.auth.signInWithPassword({email,password:pw}));return}
  const a=accts[email];if(!a)throw E('Correo o contraseña incorrectos.');
  if(!a.h)throw E('Esta cuenta usa Google. Pulsa «Iniciar sesión con Google».');
  if(a.h!==await sha(pw))throw E('Correo o contraseña incorrectos.');demoEnter(email)}
async function authReset(email){
  if(!REAL)throw E('El envío de correos se activa al conectar Supabase.');
  await sbx(sb.auth.resetPasswordForEmail(email,{redirectTo:here()}))}
async function authGoogleReal(err){try{await sbx(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:here()}}))}catch(e){err(e.message)}}
async function linkReal(){try{await sbx(sb.auth.linkIdentity({provider:'google',options:{redirectTo:here()}}))}catch(e){toast(e.message)}}
async function saveProfile(){
  if(!ses)return;ses.name=me.name;ses.bio=me.bio;ses.pub=me.pub;
  if(REAL){try{await sbx(sb.from('profiles').update({name:me.name,bio:me.bio,pub:me.pub}).eq('id',ses.uid))}catch(e){toast('No se pudo guardar en la base de datos')}}
  else if(accts[ses.email]){Object.assign(accts[ses.email],{name:me.name,bio:me.bio,pub:me.pub});store()}}
function resetData(){notifs=[];ldb={};Object.keys(PC).forEach(k=>delete PC[k]);Object.keys(VC).forEach(k=>delete VC[k]);lastLoad.feed=0;lastLoad.spaces=0;clearInterval(pollT);pollT=null;FW.length=0;Object.keys(PROF).forEach(k=>delete PROF[k]);me.fr=0;me.fg=0;uq='';ures=null;umsg='';feed=[];groups=[];chats={};wish.length=0;Object.keys(cats).forEach(k=>delete cats[k]);cats['Italianos']=[];cats['Asiáticos']=[];wsync=new Set();Object.keys(wnotes).forEach(k=>delete wnotes[k])}
async function logout(){hide();resetData();if(REAL){try{await sb.auth.signOut()}catch(e){}}else{try{localStorage.removeItem('nn_sess')}catch(e){}}showAuth()}
function googleSim(link){
  sheet(`<h2>Continuar con Google</h2><p class="mute" style="margin-top:0">Simulación: con Firebase conectado se abre la ventana oficial de Google.</p><input id="ge" type="email" placeholder="tucuenta@gmail.com" autocomplete="email" aria-label="Cuenta de Google"><div id="gerr" role="alert" class="aerr"></div><button class="btn fill" id="gc" style="width:100%;padding:12px">${link?'Vincular cuenta':'Continuar'}</button>`);
  const fn=()=>{const em=$('#ge').value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(em))return $('#gerr').textContent='⚠ Escribe un email válido';
    if(link){ses.g=true;accts[ses.email].g=true;store();hide();toast('Cuenta de Google vinculada');return}
    if(!accts[em]){const b=em.split('@')[0].replace(/[^a-z0-9._]/g,'').slice(0,20)||'usuario';let u=b,i=0;while(Object.values(accts).some(a=>a.user==u))u=b+(++i);
      accts[em]={name:b.replace(/[._]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),user:u,g:true,bio:'',pub:true}}
    accts[em].g=true;store();hide();demoEnter(em)};
  $('#gc').onclick=fn;$('#ge').onkeydown=e=>{if(e.key=='Enter')fn()};$('#ge').focus();
}
function authView(){
  const up=amode=='up';
  $('#auth').innerHTML=`<div class="ig"><div class="igc"><div style="margin-bottom:${up?12:26}px">${LOGO(52)}<div style="font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:6px">Ñam Ñam</div></div>
  ${up?`<p class="igt">Regístrate para ver los restaurantes y reseñas de tus amigos.</p><button class="btn gbtn" id="gg">${GICON} Registrarte con Google</button><div class="or"><span>O</span></div>`:''}
  <label class="igf"><input id="ae" type="email" placeholder=" " autocomplete="email" aria-label="Correo electrónico"><span>Correo electrónico</span></label>
  ${up?`<label class="igf"><input id="an" placeholder=" " autocomplete="name" aria-label="Nombre completo"><span>Nombre completo</span></label><label class="igf"><input id="au" placeholder=" " autocomplete="username" autocapitalize="none" aria-label="Nombre de usuario"><span>Nombre de usuario</span></label>`:''}
  <label class="igf"><input id="ap" type="password" placeholder=" " autocomplete="${up?'new-password':'current-password'}" aria-label="Contraseña" style="padding-right:76px"><span>Contraseña</span><button type="button" class="lk sh" id="sh" hidden>Mostrar</button></label>
  ${up?'<p class="mute" style="font-size:12px;margin:6px 0">Al registrarte aceptas las condiciones y la política de privacidad de Ñam Ñam.</p>':''}
  <button class="igb" id="as" disabled>${up?'Registrarte':'Iniciar sesión'}</button>
  <div id="aerr" role="alert" class="aerr" style="margin-top:10px"></div>
  ${up?'':`<div class="or"><span>O</span></div><button class="btn gbtn" id="gg">${GICON} Iniciar sesión con Google</button><div style="margin-top:14px"><button class="lk sm" id="fp">¿Has olvidado tu contraseña?</button></div>`}
  </div><div class="igc s">${up?'¿Tienes una cuenta?':'¿No tienes una cuenta?'} <button class="lk" data-am="${up?'in':'up'}">${up?'Inicia sesión':'Regístrate'}</button></div>
  ${REAL?'':'<p class="mute" style="text-align:center;font-size:12px">Modo demostración: las cuentas se guardan solo en este navegador. Conecta Firebase para guardarlas en una base de datos real.</p>'}</div>`;
  const val=()=>({email:$('#ae').value.trim().toLowerCase(),pw:$('#ap').value,name:up?$('#an').value.trim():'',user:up?$('#au').value.trim():''});
  const ok=()=>{const d=val();return /^\S+@\S+\.\S+$/.test(d.email)&&d.pw.length>=6&&(!up||(d.name&&/^[a-z0-9._]{3,20}$/.test(d.user)))};
  const chk=()=>{$('#as').disabled=!ok()};
  const err=m=>$('#aerr').textContent=m?'⚠ '+m:'';
  const submit=async()=>{if(!ok())return;err('');$('#as').disabled=true;const d=val();
    try{if(up)await authRegister(d);else await authLogin(d.email,d.pw)}catch(e){err(e.message)}chk()};
  document.querySelectorAll('#auth input').forEach(i=>{
    i.oninput=()=>{if(i.id=='au')i.value=i.value.toLowerCase().replace(/[^a-z0-9._]/g,'');if(i.id=='ap')$('#sh').hidden=!i.value;chk()};
    i.onkeydown=e=>{if(e.key=='Enter')submit()}});
  $('#sh').onclick=()=>{const p=$('#ap'),h=p.type=='password';p.type=h?'text':'password';$('#sh').textContent=h?'Ocultar':'Mostrar'};
  $('#as').onclick=submit;
  $('#gg').onclick=()=>REAL?authGoogleReal(err):googleSim(false);
  if(!up)$('#fp').onclick=async()=>{const m=$('#ae').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m))return err('Escribe tu correo arriba y vuelve a pulsar.');
    try{await authReset(m);err('');$('#aerr').textContent='✉ Si existe una cuenta con ese correo, te hemos enviado un enlace para restablecerla.'}catch(e){err(e.message)}};
  document.querySelectorAll('#auth [data-am]').forEach(b=>b.onclick=()=>{amode=b.dataset.am;authView()});
}
async function boot(){
  showAuth();
  if(REAL){
    try{await sbInit()}catch(e){$('#aerr').textContent='⚠ No se pudo conectar con Supabase. Revisa la configuración.';return}
    sb.auth.onAuthStateChange((ev,session)=>{
      if(ev=='PASSWORD_RECOVERY')setTimeout(()=>{sheet(`<h2>Nueva contraseña</h2><input id="np" type="password" placeholder="Nueva contraseña (mínimo 6)" autocomplete="new-password" aria-label="Nueva contraseña"><div id="nperr" class="aerr"></div><button class="btn fill" id="npb" style="width:100%;padding:12px">Guardar contraseña</button>`);
        $('#npb').onclick=async()=>{const p=$('#np').value;if(p.length<6)return $('#nperr').textContent='⚠ Mínimo 6 caracteres';try{await sbx(sb.auth.updateUser({password:p}));hide();toast('Contraseña actualizada')}catch(e){$('#nperr').textContent='⚠ '+e.message}}},300);
      if(session){if(ses&&ses.uid==session.user.id)return;
        setTimeout(()=>afterSession(session.user).catch(()=>{showAuth();$('#aerr').textContent='⚠ No se pudo cargar tu perfil. Revisa la configuración de la base de datos.'}),0)}
      else if(ev=='SIGNED_OUT')showAuth()});
    return}
  let e=null;try{e=localStorage.getItem('nn_sess')}catch(x){}
  if(e&&accts[e])demoEnter(e)}
render();boot();
</script>
